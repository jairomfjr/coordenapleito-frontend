services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://181.215.134.218:8083/coordenapleito-api}
    container_name: coordenapleito-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://181.215.134.218:8083/coordenapleito-api}
      - BACKEND_URL=${BACKEND_URL:-http://181.215.134.218:8083}
    ports:
      - "3005:3000"
    networks:
      - coordenapleito-network
    restart: unless-stopped

networks:
  coordenapleito-network:
    driver: bridge
